name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 逻辑测试使用桩，不安装依赖、不执行包生命周期脚本或真实账号登录。
      - name: Run tests
        run: node tests/run-all.mjs

      - name: Check manifest and syntax
        run: |
          node scripts/check-manifest.mjs
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/mimo-login.js
          node --check lib/cookie-login.js
          node --check lib/opendesign-login.js
          node --check lib/volcengine.js
          node --check lib/grok-credits.js

      - name: Pack and validate release asset
        run: |
          npm pack --ignore-scripts --json > pack.json
          node scripts/prepare-release.mjs

      - name: Upload verified build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-package
          path: dist/dsh-subusage.tgz
          if-no-files-found: error
          retention-days: 7
