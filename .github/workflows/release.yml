# 仅版本标签推送触发 GitHub Release 与 npm 发布；分支推送只运行 CI。
name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

jobs:
  release:
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-dsh-subusage
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) throw new Error('Tag must match package.json version');
          NODE

      - name: Run tests
        run: node tests/run-all.mjs

      - name: Check manifest and syntax
        run: |
          node scripts/check-manifest.mjs
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/mimo-login.js
          node --check lib/cookie-login.js
          node --check lib/opendesign-login.js

      - name: Pack and validate release asset
        run: |
          npm pack --ignore-scripts --json > pack.json
          node scripts/prepare-release.mjs

      - name: Create versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/dsh-subusage.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
          # 由 GitHub 按版本和发布时间判定 latest。
          make_latest: legacy

      # npm 信任绑定 release.yml：仅版本标签触发此处的 OIDC 发布。
      # registry 已有该版本时跳过，重复运行不会再次发布。
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Publish to npm (new versions only)
        run: node scripts/publish-npm.mjs
