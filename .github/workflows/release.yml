# 可选的语义版本发布；main 的自动构建发布在 ci.yml 中执行。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-dsh-subusage
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) throw new Error('Tag must match package.json version');
          NODE

      - name: Run tests
        run: node tests/run-all.mjs

      - name: Check manifest and syntax
        run: |
          node scripts/check-manifest.mjs
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/mimo-login.js

      - name: Pack and validate release asset
        run: |
          npm pack --ignore-scripts --json > pack.json
          node scripts/prepare-release.mjs

      - name: Create versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dsh-subusage.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
          # latest 由 main 的自动发布维护，旧 tag 不得使它回退。
          make_latest: false

      # npm 发布与 ci.yml 的 main 自动发布共用同一幂等守卫：registry 已有该版本时
      # 跳过，因此先推 main 再打 tag（或只打 tag）都不会重复发布。
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Publish to npm (new versions only)
        run: node scripts/publish-npm.mjs
