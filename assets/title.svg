<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB','Helvetica Neue',Arial,sans-serif">
  <title id="title">dsh-subusage —— DeepSeek Harness 订阅用量显示</title>
  <desc id="desc">标题图。左侧是项目名、中文副标题与三块能力，下面一排与真实组件同款的余量药丸：每个额度窗口一根迷你横条，满格为 100% 剩余，颜色是该窗口自己的档位色，正常态只画彩条、需要留意时才多一个词。右侧是同一个用量弹层的浅色与深色两版，2D 倾斜、互相重叠并排：标题行是厂商名，下面是状态横幅（状态圆 + 结论 + 「最紧张」依据），再下面是三张灰底窗口卡（窗口名、档位标签、剩余百分比、轨道余量条与重置时间），示例取 OpenCode Go 的三条额度限制（滚动 / 每周 / 每月）；页脚是「更新于」与「立即刷新」。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="0.55" stop-color="#101c31"/>
      <stop offset="1" stop-color="#0b2233"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gOk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="gWarn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-25%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1150" cy="24" r="190" fill="#22d3ee" opacity="0.07"/>
  <circle cx="800" cy="312" r="150" fill="#6366f1" opacity="0.09"/>
  <rect x="0" y="0" width="10" height="320" fill="url(#edge)"/>

  <text x="64" y="88" font-size="18" letter-spacing="3" fill="#38bdf8">DSH PLUGIN · SUBSCRIPTION USAGE</text>
  <text x="64" y="154" font-size="62" font-weight="700" fill="#f8fafc">dsh-subusage</text>
  <text x="64" y="198" font-size="26" fill="#cbd5e1">DeepSeek Harness 订阅用量显示</text>
  <text x="64" y="230" font-size="17" fill="#8aa0b8">模型选择器余量药丸 · 提供商开关与凭据 · 只读额度 API</text>

  <!-- 药丸：与组件同款——一列迷你横条（满格 = 100% 剩余，颜色是该窗口自己的档位色），正常态不写字 -->
  <rect x="64" y="252" width="58" height="26" rx="13" fill="none" stroke="rgba(148,163,184,.35)"/>
  <rect x="76" y="257" width="34" height="4" rx="2" fill="#1e293b"/>
  <rect x="76" y="257" width="34" height="4" rx="2" fill="url(#gOk)"/>
  <rect x="76" y="263" width="34" height="4" rx="2" fill="#1e293b"/>
  <rect x="76" y="263" width="4.1" height="4" rx="2" fill="url(#gWarn)"/>
  <rect x="76" y="269" width="34" height="4" rx="2" fill="#1e293b"/>
  <rect x="76" y="269" width="10.5" height="4" rx="2" fill="url(#gOk)"/>

  <rect x="132" y="252" width="152" height="26" rx="13" fill="rgba(245,158,11,.10)" stroke="rgba(245,158,11,.45)"/>
  <rect x="144" y="258.5" width="34" height="5" rx="2.5" fill="#1e293b"/>
  <rect x="144" y="258.5" width="29.6" height="5" rx="2.5" fill="url(#gOk)"/>
  <rect x="144" y="266.5" width="34" height="5" rx="2.5" fill="#1e293b"/>
  <rect x="144" y="266.5" width="4.1" height="5" rx="2.5" fill="url(#gWarn)"/>
  <text x="188" y="270" font-size="12" font-weight="600" fill="#fbbf24">周 偏少</text>

  <rect x="296" y="252" width="116" height="26" rx="13" fill="rgba(239,68,68,.10)" stroke="rgba(239,68,68,.45)"/>
  <rect x="308" y="262" width="34" height="6" rx="3" fill="#1e293b"/>
  <text x="352" y="270" font-size="12" font-weight="600" fill="#f87171">已用尽</text>

  <text x="64" y="302" font-size="12.5" fill="#64748b">外层耗尽会连坐内层；多窗口取最差一窗 · 缓存 60 秒</text>

  <!-- 用量弹层 · 浅色主题（右侧被深色那张压住，左侧的标题、结论、窗口名与百分比都完整可读） -->
  <g transform="translate(830 160) rotate(-7)" filter="url(#cardShadow)">
    <rect x="-170" y="-132" width="340" height="264" rx="14" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.5"/>
    <text x="-156" y="-106" font-size="13" font-weight="700" fill="#0f172a">OpenCode Go</text>
    <rect x="-156" y="-98" width="312" height="38" rx="10" fill="rgba(239,68,68,.10)" stroke="rgba(239,68,68,.35)"/>
    <circle cx="-138" cy="-79" r="10" fill="#ef4444"/>
    <text x="-138" y="-75" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">✕</text>
    <text x="-120" y="-82" font-size="13" font-weight="700" fill="#b91c1c">额度已用尽</text>
    <text x="-120" y="-67" font-size="10" fill="#64748b">最紧张：每月 · 剩 0%</text>
    <g>
      <rect x="-156" y="-52" width="312" height="46" rx="10" fill="rgba(128,128,128,.07)"/>
      <text x="-144" y="-38" font-size="12" font-weight="700" fill="#0f172a">滚动</text>
      <text x="-112" y="-35" font-size="17" font-weight="700" fill="#16a34a">100%<tspan font-size="9" font-weight="400" fill="#94a3b8" dx="3">剩余</tspan></text>
      <rect x="-144" y="-32" width="288" height="7" rx="3.5" fill="rgba(128,128,128,.22)"/>
      <rect x="-144" y="-32" width="288" height="7" rx="3.5" fill="#22c55e"/>
      <text x="-144" y="-16" font-size="9.5" fill="#64748b">重置于 40 分钟后</text>
    </g>
    <g>
      <rect x="-156" y="0" width="312" height="46" rx="10" fill="rgba(128,128,128,.07)"/>
      <text x="-144" y="14" font-size="12" font-weight="700" fill="#0f172a">每周</text>
      <rect x="-114" y="3" width="46" height="14" rx="7" fill="rgba(217,119,6,.14)"/>
      <circle cx="-106" cy="10" r="2.5" fill="#d97706"/>
      <text x="-100" y="13.5" font-size="8.5" fill="#78350f">偏少</text>
      <text x="-54" y="17" font-size="17" font-weight="700" fill="#d97706">12%<tspan font-size="9" font-weight="400" fill="#94a3b8" dx="3">剩余</tspan></text>
      <rect x="-144" y="20" width="288" height="7" rx="3.5" fill="rgba(128,128,128,.22)"/>
      <rect x="-144" y="20" width="34.6" height="7" rx="3.5" fill="#f59e0b"/>
      <text x="-144" y="36" font-size="9.5" fill="#64748b">重置于 3 天后</text>
    </g>
    <g>
      <rect x="-156" y="52" width="312" height="46" rx="10" fill="rgba(128,128,128,.07)"/>
      <text x="-144" y="66" font-size="12" font-weight="700" fill="#0f172a">每月</text>
      <rect x="-114" y="55" width="66" height="14" rx="7" fill="rgba(220,38,38,.12)"/>
      <circle cx="-106" cy="62" r="2.5" fill="#dc2626"/>
      <text x="-100" y="65.5" font-size="8.5" fill="#7f1d1d">已达限额</text>
      <text x="-34" y="69" font-size="17" font-weight="700" fill="#dc2626">0%<tspan font-size="9" font-weight="400" fill="#94a3b8" dx="3">剩余</tspan></text>
      <rect x="-144" y="72" width="288" height="7" rx="3.5" fill="rgba(128,128,128,.22)"/>
      <text x="-144" y="88" font-size="9.5" fill="#64748b">重置于 12 天后</text>
    </g>
    <text x="-156" y="113" font-size="9.5" fill="#94a3b8">更新于 2026/10/11</text>
    <rect x="72" y="101" width="84" height="17" rx="8" fill="rgba(59,130,246,.14)"/>
    <text x="114" y="113" font-size="9.5" font-weight="600" fill="#0f172a" text-anchor="middle">立即刷新</text>
  </g>

  <!-- 用量弹层 · 深色主题（同一份数据，叠在浅色那张上面） -->
  <g transform="translate(1020 160) rotate(-7)" filter="url(#cardShadow)">
    <rect x="-170" y="-132" width="340" height="264" rx="14" fill="#16233a" stroke="#33456b" stroke-width="1.5"/>
    <text x="-156" y="-106" font-size="13" font-weight="700" fill="#e2e8f0">OpenCode Go</text>
    <rect x="-156" y="-98" width="312" height="38" rx="10" fill="rgba(239,68,68,.14)" stroke="rgba(239,68,68,.4)"/>
    <circle cx="-138" cy="-79" r="10" fill="#ef4444"/>
    <text x="-138" y="-75" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">✕</text>
    <text x="-120" y="-82" font-size="13" font-weight="700" fill="#f87171">额度已用尽</text>
    <text x="-120" y="-67" font-size="10" fill="#94a3b8">最紧张：每月 · 剩 0%</text>
    <g>
      <rect x="-156" y="-52" width="312" height="46" rx="10" fill="rgba(255,255,255,.06)"/>
      <text x="-144" y="-38" font-size="12" font-weight="700" fill="#e2e8f0">滚动</text>
      <text x="-112" y="-35" font-size="17" font-weight="700" fill="#4ade80">100%<tspan font-size="9" font-weight="400" fill="#94a3b8" dx="3">剩余</tspan></text>
      <rect x="-144" y="-32" width="288" height="7" rx="3.5" fill="rgba(148,163,184,.22)"/>
      <rect x="-144" y="-32" width="288" height="7" rx="3.5" fill="#22c55e"/>
      <text x="-144" y="-16" font-size="9.5" fill="#94a3b8">重置于 40 分钟后</text>
    </g>
    <g>
      <rect x="-156" y="0" width="312" height="46" rx="10" fill="rgba(255,255,255,.06)"/>
      <text x="-144" y="14" font-size="12" font-weight="700" fill="#e2e8f0">每周</text>
      <rect x="-114" y="3" width="46" height="14" rx="7" fill="rgba(245,158,11,.18)"/>
      <circle cx="-106" cy="10" r="2.5" fill="#f59e0b"/>
      <text x="-100" y="13.5" font-size="8.5" fill="#fde68a">偏少</text>
      <text x="-54" y="17" font-size="17" font-weight="700" fill="#fbbf24">12%<tspan font-size="9" font-weight="400" fill="#94a3b8" dx="3">剩余</tspan></text>
      <rect x="-144" y="20" width="288" height="7" rx="3.5" fill="rgba(148,163,184,.22)"/>
      <rect x="-144" y="20" width="34.6" height="7" rx="3.5" fill="#f59e0b"/>
      <text x="-144" y="36" font-size="9.5" fill="#94a3b8">重置于 3 天后</text>
    </g>
    <g>
      <rect x="-156" y="52" width="312" height="46" rx="10" fill="rgba(255,255,255,.06)"/>
      <text x="-144" y="66" font-size="12" font-weight="700" fill="#e2e8f0">每月</text>
      <rect x="-114" y="55" width="66" height="14" rx="7" fill="rgba(239,68,68,.18)"/>
      <circle cx="-106" cy="62" r="2.5" fill="#ef4444"/>
      <text x="-100" y="65.5" font-size="8.5" fill="#fecaca">已达限额</text>
      <text x="-34" y="69" font-size="17" font-weight="700" fill="#f87171">0%<tspan font-size="9" font-weight="400" fill="#94a3b8" dx="3">剩余</tspan></text>
      <rect x="-144" y="72" width="288" height="7" rx="3.5" fill="rgba(148,163,184,.22)"/>
      <text x="-144" y="88" font-size="9.5" fill="#94a3b8">重置于 12 天后</text>
    </g>
    <text x="-156" y="113" font-size="9.5" fill="#94a3b8">更新于 2026/10/11</text>
    <rect x="72" y="101" width="84" height="17" rx="8" fill="rgba(59,130,246,.18)"/>
    <text x="114" y="113" font-size="9.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">立即刷新</text>
  </g>
</svg>
