<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB','Helvetica Neue',Arial,sans-serif">
  <title id="title">dsh-subusage —— DeepSeek Harness 订阅用量显示</title>
  <desc id="desc">标题图。左侧是项目名、中文副标题与三块能力，下面一排与真实组件同款的余量药丸：每个额度窗口一根迷你横条，满格为 100% 剩余，颜色是该窗口自己的档位色，正常态只画彩条、需要留意时才多一个词。右侧以「OpenCode Go」的三条额度限制为例（滚动 / 每周 / 每月），两张 2D 倾斜、互相重叠并排的窗口卡并列出同一份数据的浅色与深色主题。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="0.55" stop-color="#101c31"/>
      <stop offset="1" stop-color="#0b2233"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gOk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="gWarn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-25%" width="130%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1150" cy="26" r="190" fill="#22d3ee" opacity="0.07"/>
  <circle cx="800" cy="312" r="150" fill="#6366f1" opacity="0.09"/>
  <rect x="0" y="0" width="10" height="320" fill="url(#edge)"/>

  <text x="64" y="88" font-size="18" letter-spacing="3" fill="#38bdf8">DSH PLUGIN · SUBSCRIPTION USAGE</text>
  <text x="64" y="154" font-size="62" font-weight="700" fill="#f8fafc">dsh-subusage</text>
  <text x="64" y="198" font-size="26" fill="#cbd5e1">DeepSeek Harness 订阅用量显示</text>
  <text x="64" y="230" font-size="17" fill="#8aa0b8">模型选择器余量药丸 · 提供商开关与凭据 · 只读额度 API</text>

  <!-- 药丸：与组件同款——一列迷你横条（满格 = 100% 剩余，颜色是该窗口自己的档位色），正常态不写字 -->
  <rect x="64" y="252" width="58" height="26" rx="13" fill="none" stroke="rgba(148,163,184,.35)"/>
  <rect x="76" y="257" width="34" height="4" rx="2" fill="#1e293b"/>
  <rect x="76" y="257" width="34" height="4" rx="2" fill="url(#gOk)"/>
  <rect x="76" y="263" width="34" height="4" rx="2" fill="#1e293b"/>
  <rect x="76" y="263" width="4.1" height="4" rx="2" fill="url(#gWarn)"/>
  <rect x="76" y="269" width="34" height="4" rx="2" fill="#1e293b"/>
  <rect x="76" y="269" width="10.5" height="4" rx="2" fill="url(#gOk)"/>

  <rect x="132" y="252" width="152" height="26" rx="13" fill="rgba(245,158,11,.10)" stroke="rgba(245,158,11,.45)"/>
  <rect x="144" y="258.5" width="34" height="5" rx="2.5" fill="#1e293b"/>
  <rect x="144" y="258.5" width="29.6" height="5" rx="2.5" fill="url(#gOk)"/>
  <rect x="144" y="266.5" width="34" height="5" rx="2.5" fill="#1e293b"/>
  <rect x="144" y="266.5" width="4.1" height="5" rx="2.5" fill="url(#gWarn)"/>
  <text x="188" y="270" font-size="12" font-weight="600" fill="#fbbf24">周 偏少</text>

  <rect x="296" y="252" width="116" height="26" rx="13" fill="rgba(239,68,68,.10)" stroke="rgba(239,68,68,.45)"/>
  <rect x="308" y="262" width="34" height="6" rx="3" fill="#1e293b"/>
  <text x="352" y="270" font-size="12" font-weight="600" fill="#f87171">已用尽</text>

  <text x="64" y="302" font-size="12.5" fill="#64748b">外层耗尽会连坐内层；多窗口取最差一窗 · 缓存 60 秒</text>

  <!-- 同一份数据的两张窗口卡：亮色主题在前、深色主题在后，2D 倾斜、重叠并排斜向展开。
       示例取 OpenCode Go 的三条额度限制（滚动 / 每周 / 每月），每张露出的左侧都能看清窗口名与剩余百分比 -->
  <g>
    <g transform="translate(860 118) rotate(-7)" filter="url(#cardShadow)">
      <rect x="-150" y="-75" width="300" height="150" rx="18" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.5"/>
      <text x="-130" y="-50" font-size="15" font-weight="700" fill="#334155">OpenCode Go</text>
      <text x="-130" y="-20" font-size="14" fill="#64748b">滚动</text>
      <text x="-84" y="-20" font-size="19" font-weight="700" fill="#16a34a">100%</text>
      <rect x="-130" y="-12" width="260" height="8" rx="4" fill="#e5eaf1"/>
      <rect x="-130" y="-12" width="260" height="8" rx="4" fill="#22c55e"/>
      <text x="-130" y="12" font-size="14" fill="#64748b">每周</text>
      <text x="-84" y="12" font-size="19" font-weight="700" fill="#d97706">12%</text>
      <rect x="-130" y="20" width="260" height="8" rx="4" fill="#e5eaf1"/>
      <rect x="-130" y="20" width="31.2" height="8" rx="4" fill="#f59e0b"/>
      <text x="-130" y="44" font-size="14" fill="#64748b">每月</text>
      <text x="-84" y="44" font-size="19" font-weight="700" fill="#dc2626">0%</text>
      <rect x="-130" y="52" width="260" height="8" rx="4" fill="#e5eaf1"/>
    </g>
    <g transform="translate(1010 166) rotate(-7)" filter="url(#cardShadow)">
      <rect x="-150" y="-75" width="300" height="150" rx="18" fill="#16233a" stroke="#33456b" stroke-width="1.5"/>
      <text x="-130" y="-50" font-size="15" font-weight="700" fill="#e2e8f0">OpenCode Go</text>
      <text x="-130" y="-20" font-size="14" fill="#94a3b8">滚动</text>
      <text x="-84" y="-20" font-size="19" font-weight="700" fill="#4ade80">100%</text>
      <rect x="-130" y="-12" width="260" height="8" rx="4" fill="#1e293b"/>
      <rect x="-130" y="-12" width="260" height="8" rx="4" fill="#22c55e"/>
      <text x="-130" y="12" font-size="14" fill="#94a3b8">每周</text>
      <text x="-84" y="12" font-size="19" font-weight="700" fill="#fbbf24">12%</text>
      <rect x="-130" y="20" width="260" height="8" rx="4" fill="#1e293b"/>
      <rect x="-130" y="20" width="31.2" height="8" rx="4" fill="#f59e0b"/>
      <text x="-130" y="44" font-size="14" fill="#94a3b8">每月</text>
      <text x="-84" y="44" font-size="19" font-weight="700" fill="#f87171">0%</text>
      <rect x="-130" y="52" width="260" height="8" rx="4" fill="#1e293b"/>
    </g>
  </g>
</svg>
